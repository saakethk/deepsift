[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsift"
version = "0.2.0"
description = "High-performance historical Reddit research toolkit and scraper for Arctic Shift."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Saaketh Kesireddy" }
]
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
deepsift = "deepsift.cli:cli"
reddit-scraper = "deepsift.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["deepsift*"]

[tool.pytest.ini_options]
markers = [
    "live: marks tests requiring live network connectivity to external APIs (Arctic Shift)",
]
