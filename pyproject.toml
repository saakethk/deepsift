[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reddit-research-scraper"
version = "0.2.0"
description = "A high-performance historical Reddit research toolkit and scraper for Arctic Shift."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Saaketh Kesireddy" }
]
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "nest-asyncio>=1.6.0",
]

[project.scripts]
reddit-scraper = "scripts.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
